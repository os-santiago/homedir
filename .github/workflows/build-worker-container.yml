name: Build and Push AI-SDLC Worker Container

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'Manual build'
        type: string
  push:
    branches:
      - main
    paths:
      - 'container/Containerfile.worker'
      - 'container/worker-entrypoint.sh'
      - 'container/sc-agent-config.json'
      - 'platform/scripts/homedir-sdlc-worker.sh'
      - 'platform/scripts/policy-*.sh'
      - 'platform/config/autonomous-decision-policy.yaml'
      - '.github/workflows/build-worker-container.yml'

concurrency:
  group: build-worker-container
  cancel-in-progress: false

jobs:
  build:
    name: Build Worker Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      WORKER_IMAGE_NAME: homedir-ai-sdlc-worker
      QUAY_REGISTRY: ${{ vars.REGISTRY || 'quay.io' }}
      QUAY_ORG: ${{ vars.QUAY_ORG || github.repository_owner }}

    steps:
      - name: Checkout homedir
        uses: actions/checkout@v6
        with:
          path: homedir

      - name: Checkout sc-agent-cli
        uses: actions/checkout@v6
        with:
          repository: os-santiago/sc-agent-cli
          path: sc-agent-cli
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: image_meta
        run: |
          set -euo pipefail
          org_lower="$(echo "${QUAY_ORG}" | tr '[:upper:]' '[:lower:]')"
          image_lower="$(echo "${WORKER_IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"

          # Primary: quay.io
          quay_image="${QUAY_REGISTRY}/${org_lower}/${image_lower}"

          # Fallback: ghcr.io
          ghcr_image="ghcr.io/${org_lower}/${image_lower}"

          echo "quay_image=${quay_image}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${ghcr_image}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Quay.io
        if: ${{ vars.QUAY_USERNAME && secrets.QUAY_PASSWORD }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: homedir
          file: homedir/container/Containerfile.worker
          build-contexts: |
            sc-agent-cli=./sc-agent-cli
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image_meta.outputs.quay_image }}:latest
            ${{ steps.image_meta.outputs.quay_image }}:${{ steps.image_meta.outputs.tag }}
            ${{ steps.image_meta.outputs.ghcr_image }}:latest
            ${{ steps.image_meta.outputs.ghcr_image }}:${{ steps.image_meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          set -euo pipefail
          echo "Verifying SCC installation in image..."

          docker run --rm \
            --entrypoint bash \
            ${{ steps.image_meta.outputs.ghcr_image }}:latest \
            -c "which scc && scc --version || echo 'SCC not found'"

          echo ""
          echo "✅ Worker image built and pushed successfully"
          echo ""
          echo "Images:"
          echo "  - ${{ steps.image_meta.outputs.quay_image }}:latest"
          echo "  - ${{ steps.image_meta.outputs.quay_image }}:${{ steps.image_meta.outputs.tag }}"
          echo "  - ${{ steps.image_meta.outputs.ghcr_image }}:latest"
          echo "  - ${{ steps.image_meta.outputs.ghcr_image }}:${{ steps.image_meta.outputs.tag }}"

      - name: Build summary
        run: |
          {
            echo "# Worker Container Build Summary"
            echo ""
            echo "✅ Worker container built and pushed successfully"
            echo ""
            echo "## Images Published"
            echo ""
            echo "### Primary (Quay.io)"
            echo "- \`${{ steps.image_meta.outputs.quay_image }}:latest\`"
            echo "- \`${{ steps.image_meta.outputs.quay_image }}:${{ steps.image_meta.outputs.tag }}\`"
            echo ""
            echo "### Fallback (ghcr.io)"
            echo "- \`${{ steps.image_meta.outputs.ghcr_image }}:latest\`"
            echo "- \`${{ steps.image_meta.outputs.ghcr_image }}:${{ steps.image_meta.outputs.tag }}\`"
            echo ""
            echo "## Next Steps"
            echo ""
            echo "The K3s deployment will automatically pull the updated image on next reconciliation cycle."
            echo ""
            echo "**Reason:** ${{ github.event.inputs.reason || 'Auto-build on push to main' }}"
          } >> "${GITHUB_STEP_SUMMARY}"
