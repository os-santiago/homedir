name: Tarea
description: Una unidad de trabajo bien definida
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        _Plantilla en español. English template available at the top level._
  - type: dropdown
    id: type
    attributes:
      label: Tipo de Tarea
      options:
        - Implementacion
        - Refactorizacion
        - Documentacion
        - Investigacion / Analisis
        - Pruebas
        - DevOps
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / Backend
        - Frontend / UI
        - CI / DevOps
        - Documentacion
        - Seguridad
        - Rendimiento
        - Gobernanza
        - Otro
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Que hay que hacer y por que?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Alcance
      value: |
        **In scope:**
        -

        **Out of scope:**
        -

  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de Aceptación
      description: |
        Criterios medibles de completitud
        **⚠️ Requisito AI-SDLC: Máximo 2 criterios para implementación autónoma**
      placeholder: |
        - [ ] Funcionalidad X implementada y funcionando
        - [ ] Las pruebas pasan (comando de validación abajo)
    validations:
      required: true

  - type: textarea
    id: affected_files
    attributes:
      label: Archivos Afectados (Estimación)
      description: ¿Qué archivos necesitarán cambios? (Ayuda al AI-SDLC a dimensionar el trabajo)
      placeholder: |
        - src/main/java/com/scanales/homedir/ServicioFuncionalidad.java
        - src/test/java/com/scanales/homedir/ServicioFuncionalidadTest.java
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Comando de Validación
      description: ¿Cómo se puede validar el trabajo? (Requerido para AI-SDLC)
      placeholder: |
        mvn test -Dtest=ServicioFuncionalidadTest
        o
        ./gradlew test --tests ServicioFuncionalidadTest
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Complejidad Estimada
      description: |
        **Simple**: 1 archivo, <50 líneas, implementación obvia
        **Medio**: 2-3 archivos, <200 líneas, alcance claro
        **Complejo**: >3 archivos o requiere decisión arquitectónica (considerar descomposición)
      options:
        - Simple
        - Medio
        - Complejo
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias
      placeholder: "Bloqueado por: #123\nBloquea: #456"

  - type: checkboxes
    id: definition
    attributes:
      label: Definition of Ready
      options:
        - label: Objetivo claramente definido
        - label: Criterios de aceptación definidos (máx 2 para AI-SDLC)
        - label: Archivos afectados identificados
        - label: Comando de validación especificado
        - label: Alcance definido (in/out)
        - label: No existe issue duplicado
    validations:
      required: true
