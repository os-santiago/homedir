name: Reporte de Bug
description: Reporta un error para ayudarnos a mejorar
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un error. Proporciona la mayor cantidad de detalles posible.
        _Plantilla en español. English template available at the top level._

  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      options:
        - Critico (sistema caido / perdida de datos)
        - Alto (funcionalidad rota, sin workaround)
        - Medio (funcionalidad rota, con workaround)
        - Bajo (cosmetico / menor)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / Backend
        - Frontend / UI
        - CI / DevOps
        - Documentacion
        - Seguridad
        - Rendimiento
        - Otro
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descripcion
      description: Descripcion clara y concisa del error
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para Reproducir
      description: Pasos para reproducir el comportamiento
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento Actual
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto Tecnico
      description: Entorno, logs, capturas de pantalla

  - type: textarea
    id: affected_files
    attributes:
      label: Archivos Afectados (Estimación)
      description: ¿Qué archivos probablemente contienen el bug? (Ayuda al AI-SDLC a localizar el problema)
      placeholder: |
        - src/main/java/com/scanales/homedir/service/ServicioConBug.java
        - src/main/resources/templates/pagina-con-error.html
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de Aceptación
      description: |
        ¿Cómo sabemos que el bug está corregido?
        **⚠️ Requisito AI-SDLC: Máximo 2 criterios para implementación autónoma**
      placeholder: |
        - [ ] El bug ya no se reproduce siguiendo los pasos anteriores
        - [ ] La prueba de regresión pasa
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Comando de Validación
      description: ¿Cómo se puede validar la corrección? (Requerido para AI-SDLC)
      placeholder: |
        mvn test -Dtest=ServicioConBugTest
        o
        curl http://localhost:8080/api/endpoint | grep "esperado"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Complejidad del Fix
      description: |
        **Simple**: 1 archivo, <50 líneas, corrección obvia
        **Medio**: 2-3 archivos, <200 líneas, alcance claro
        **Complejo**: >3 archivos o causa raíz poco clara (puede necesitar investigación)
      options:
        - Simple
        - Medio
        - Complejo
    validations:
      required: true

  - type: checkboxes
    id: definition
    attributes:
      label: Definition of Ready
      options:
        - label: Impacto y severidad evaluados
          required: true
        - label: Pasos para reproducir claros
          required: true
        - label: Comportamiento esperado vs actual definido
          required: true
        - label: Contexto técnico proporcionado
          required: true
        - label: Archivos afectados identificados
          required: true
        - label: Criterios de aceptación definidos (máx 2 para AI-SDLC)
          required: true
        - label: Comando de validación especificado
          required: true
        - label: No existe issue duplicado
          required: true
    validations:
      required: true
