name: Solicitud de Funcionalidad
description: Sugiere una nueva funcionalidad o mejora
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por sugerir una funcionalidad. Describe el problema que resuelve.
        _Plantilla en español. English template available at the top level._

  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options:
        - Critico (bloquea release)
        - Alto (brecha importante)
        - Medio (deseable)
        - Bajo (consideracion futura)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / Backend
        - Frontend / UI
        - CI / DevOps
        - Documentacion
        - Seguridad
        - Rendimiento
        - Otro
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que problema resuelve esta funcionalidad?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solucion Propuesta
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de Aceptación
      description: |
        ¿Qué debe cumplirse para considerar esto completo?
        **⚠️ Requisito AI-SDLC: Máximo 2 criterios para implementación autónoma**
      placeholder: |
        - [ ] La funcionalidad funciona en escenario X
        - [ ] Las pruebas pasan (comando de validación abajo)
    validations:
      required: true

  - type: textarea
    id: affected_files
    attributes:
      label: Archivos Afectados (Estimación)
      description: ¿Qué archivos probablemente necesitarán cambios? (Ayuda al AI-SDLC a dimensionar el trabajo)
      placeholder: |
        - src/main/java/com/ejemplo/ServicioFuncionalidad.java
        - src/main/resources/templates/funcionalidad.html
        - src/test/java/com/ejemplo/ServicioFuncionalidadTest.java
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Comando de Validación
      description: ¿Cómo se puede validar la implementación? (Requerido para AI-SDLC)
      placeholder: |
        mvn test -Dtest=ServicioFuncionalidadTest
        o
        curl http://localhost:8080/api/funcionalidad | jq
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Complejidad Estimada
      description: |
        **Simple**: 1 archivo, <50 líneas, implementación obvia
        **Medio**: 2-3 archivos, <200 líneas, alcance claro
        **Complejo**: >3 archivos o decisión arquitectónica (puede necesitar descomposición)
      options:
        - Simple
        - Medio
        - Complejo
    validations:
      required: true

  - type: checkboxes
    id: definition
    attributes:
      label: Definition of Ready
      options:
        - label: Problema claramente definido
        - label: Criterios de aceptación definidos (máx 2 para AI-SDLC)
        - label: Archivos afectados identificados
        - label: Comando de validación especificado
        - label: No existe issue duplicado
        - label: Area identificada
    validations:
      required: true
