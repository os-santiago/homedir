name: Task
description: A well-defined unit of work
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template for well-defined tasks. For bugs, use the Bug Report template.
        _Please write in English. Spanish template available at `es/` if needed._

  - type: dropdown
    id: type
    attributes:
      label: Task Type
      options:
        - Implementation
        - Refactoring
        - Documentation
        - Research / Analysis
        - Testing
        - DevOps
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / Backend
        - Frontend / UI
        - CI / DevOps
        - Documentation
        - Security
        - Performance
        - Governance
        - Other
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be done and why?
      placeholder: Implement X to enable Y...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and out of scope?
      value: |
        **In scope:**
        -

        **Out of scope:**
        -

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: |
        Measurable completion criteria
        **⚠️ AI-SDLC Requirement: Maximum 2 criteria for autonomous implementation**
      placeholder: |
        - [ ] Feature X implemented and working
        - [ ] Tests pass (validation command below)
    validations:
      required: true

  - type: textarea
    id: affected_files
    attributes:
      label: Affected Files (Best Guess)
      description: Which files will need changes? (Helps AI-SDLC scope the work)
      placeholder: |
        - src/main/java/com/scanales/homedir/FeatureService.java
        - src/test/java/com/scanales/homedir/FeatureServiceTest.java
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation Command
      description: How can the work be validated? (Required for AI-SDLC)
      placeholder: |
        mvn test -Dtest=FeatureServiceTest
        or
        ./gradlew test --tests FeatureServiceTest
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: |
        **Simple**: 1 file, <50 lines, obvious implementation
        **Medium**: 2-3 files, <200 lines, clear scope
        **Complex**: >3 files or requires architectural decision (consider decomposition)
      options:
        - Simple
        - Medium
        - Complex
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Blocked by or blocking other work
      placeholder: "Blocked by: #123\nBlocks: #456"

  - type: checkboxes
    id: definition
    attributes:
      label: Definition of Ready
      options:
        - label: Objective clearly defined
        - label: Acceptance criteria defined (max 2 for AI-SDLC)
        - label: Affected files identified
        - label: Validation command specified
        - label: Scope defined (in/out)
        - label: No duplicate issue exists
    validations:
      required: true
