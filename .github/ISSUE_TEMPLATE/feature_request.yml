name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you're trying to solve.
        _Please write in English. Spanish template available at `es/` if needed._

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Critical (blocking release)
        - High (important gap)
        - Medium (nice to have)
        - Low (future consideration)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / Backend
        - Frontend / UI
        - CI / DevOps
        - Documentation
        - Security
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Users currently cannot...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds?

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: |
        What must be true for this to be considered complete?
        **⚠️ AI-SDLC Requirement: Maximum 2 criteria for autonomous implementation**
      placeholder: |
        - [ ] Feature works in X scenario
        - [ ] Tests pass (validation command below)
    validations:
      required: true

  - type: textarea
    id: affected_files
    attributes:
      label: Affected Files (Best Guess)
      description: Which files will likely need changes? (Helps AI-SDLC scope the work)
      placeholder: |
        - src/main/java/com/example/FeatureService.java
        - src/main/resources/templates/feature.html
        - src/test/java/com/example/FeatureServiceTest.java
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation Command
      description: How can the implementation be validated? (Required for AI-SDLC)
      placeholder: |
        mvn test -Dtest=FeatureServiceTest
        or
        curl http://localhost:8080/api/feature | jq
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: |
        **Simple**: 1 file, <50 lines, obvious implementation
        **Medium**: 2-3 files, <200 lines, clear scope
        **Complex**: >3 files or architectural decision (may need decomposition)
      options:
        - Simple
        - Medium
        - Complex
    validations:
      required: true

  - type: checkboxes
    id: definition
    attributes:
      label: Definition of Ready
      options:
        - label: Problem clearly defined
        - label: Acceptance criteria defined (max 2 for AI-SDLC)
        - label: Affected files identified
        - label: Validation command specified
        - label: No duplicate issue exists
        - label: Area identified
    validations:
      required: true
