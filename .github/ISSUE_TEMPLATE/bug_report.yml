name: Bug Report
description: Report a bug to help us improve
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
        _Please write in English. Spanish template available at `es/` if needed._

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (system down / data loss)
        - High (feature broken, no workaround)
        - Medium (feature broken, workaround exists)
        - Low (cosmetic / minor issue)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API / Backend
        - Frontend / UI
        - CI / DevOps
        - Documentation
        - Security
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug
      placeholder: When I try to..., the system returns...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical Context
      description: Environment details (OS, browser, version, logs, screenshots)
      placeholder: Homedir v3.x, Java 21, Chrome 120, Windows 11

  - type: textarea
    id: affected_files
    attributes:
      label: Affected Files (Best Guess)
      description: Which files likely contain the bug? (Helps AI-SDLC locate the issue)
      placeholder: |
        - src/main/java/com/scanales/homedir/service/BuggyService.java
        - src/main/resources/templates/buggy-page.html
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: |
        How do we know the bug is fixed?
        **⚠️ AI-SDLC Requirement: Maximum 2 criteria for autonomous implementation**
      placeholder: |
        - [ ] Bug no longer reproduces following steps above
        - [ ] Regression test passes
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation Command
      description: How can the fix be validated? (Required for AI-SDLC)
      placeholder: |
        mvn test -Dtest=BuggyServiceTest
        or
        curl http://localhost:8080/api/endpoint | grep "expected"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Fix Complexity
      description: |
        **Simple**: 1 file, <50 lines, obvious fix
        **Medium**: 2-3 files, <200 lines, clear scope
        **Complex**: >3 files or root cause unclear (may need investigation)
      options:
        - Simple
        - Medium
        - Complex
    validations:
      required: true

  - type: checkboxes
    id: definition
    attributes:
      label: Definition of Ready
      options:
        - label: Impact and severity assessed
          required: true
        - label: Steps to reproduce are clear
          required: true
        - label: Expected vs actual behavior defined
          required: true
        - label: Technical context provided
          required: true
        - label: Affected files identified
          required: true
        - label: Acceptance criteria defined (max 2 for AI-SDLC)
          required: true
        - label: Validation command specified
          required: true
        - label: No duplicate issue exists
          required: true
    validations:
      required: true
